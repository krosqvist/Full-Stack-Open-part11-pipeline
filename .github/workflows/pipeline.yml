name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/bloglist_test
      SECRET: default

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install
        working-directory: bloglist-frontend

      - name: Install backend dependencies
        run: npm install
        working-directory: bloglist-backend

      - name: Frontend lint
        run: npm run lint
        working-directory: bloglist-frontend

      - name: Frontend build
        run: npm run build
        working-directory: bloglist-frontend

      - name: Frontend tests
        run: npm run vitest
        working-directory: bloglist-frontend

      - name: Backend lint
        run: npm run lint
        working-directory: bloglist-backend

      - name: Backend tests
        run: npm test
        working-directory: bloglist-backend

  deploy:
    needs: [build_and_test]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          NONE_STRING_TOKEN: '#skip'
